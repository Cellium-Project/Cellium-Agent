security:
  command_blacklist:
  - remove-item -recurse -force
  - diskpart
  - mkfs
  - dd if=
  - shutdown
  - reboot
  - rm -rf /
  - chmod 777 /
  - ':(){ :|:& };:'
  permission_level: standard
  # strict = 命中规则即拦截；balanced = 灾难级拦截，其余按可回退性放行（推荐）
  block_mode: balanced
  command_timeout: 120
  shell_hard_timeout: 60
  # 单次进入 agent 上下文的命令输出上限（字符，只保留尾部）；完整输出落在临时文件里供 read 分页
  max_output_bytes: 30000
  # 持久会话 send 的输入是否走命令黑名单（仅本地 shell 会话生效；ssh/REPL 输入不检查）
  session_send_check: true
  section: security
  api_key:
    enabled: false
    key: ''
    header_name: X-API-Key
