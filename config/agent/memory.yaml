memory:
  section: memory
  memory_dir: memory
  archive_backend: sqlite
  archive_dual_write: false
  short_term:
    max_history: 200
  session_compact:
    enabled: true
    token_threshold: 0          # 触发压缩的 token 阈值；0 = 按模型上下文窗口自动算（见 compact_ratio）
    compact_ratio: 0.8          # 自动模式的触发比例：窗口 80% 时压缩（200k→160k，1M→800k）
    max_notes_length: 2000
    notes_dir: memory/notes
  long_term:
    db_file: memory/memory_index.db
    hybrid_enabled: true
    embedding:
      enabled: false
      model: ${EMBEDDING_MODEL}
      api_key: ${EMBEDDING_API_KEY}
      base_url: ${EMBEDDING_BASE_URL}
    allow_sensitive_store: false
    default_schema: general
